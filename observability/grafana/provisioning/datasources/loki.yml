apiVersion: 1

# `$$` — экранирование: Grafana подставляет env-переменные в provisioning-файлы.
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Строка лога с `trace_id=<hex>` → кнопка перехода к трассе в Tempo.
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: "trace_id=([0-9a-f]{32})"
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Открыть трассу
