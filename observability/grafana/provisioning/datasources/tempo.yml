apiVersion: 1

# `$$` — экранирование: Grafana подставляет env-переменные в provisioning-файлы.
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
      # Span → логи этой трассы в Loki (trace_id — structured metadata, см. alloy-config).
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        # Трасса прогона / LLM-джобы пишет логи в воркере, а не в backend.
        query: '{service=~"backend|parse-worker|llm-worker|hh-worker"} | trace_id="$${__trace.traceId}"'
