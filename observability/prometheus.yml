global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tg-jobs-backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  # Все реплики llm-worker (compose DNS отдаёт A-записи по имени сервиса).
  # static_configs на llm-worker:9101 при --scale скрейпит только один контейнер.
  - job_name: tg-jobs-llm-worker
    dns_sd_configs:
      - names:
          - llm-worker
        type: A
        port: 9101
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: dns_name

  - job_name: tg-jobs-parse-worker
    dns_sd_configs:
      - names:
          - parse-worker
        type: A
        port: 9102
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: dns_name
