global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Правила алертов (observability/alerts/, тесты — scripts/check_alerts.sh). Сработавшие уходят
# в Alertmanager; доставки наружу нет — см. observability/alertmanager.yml.
rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Отдельный порт метрик backend (API_METRICS_PORT), не порт API: на хост он не публикуется.
  - job_name: jobdesk-backend
    static_configs:
      - targets: ["backend:9100"]
    metrics_path: /metrics

  # Стенд нагрузочного теста (scripts/loadtest/stand.sh, контейнер lt-api). DNS SD:
  # без стенда имя не резолвится — целей нет, а не down-таргет.
  - job_name: jobdesk-loadtest
    scrape_interval: 5s
    dns_sd_configs:
      - names:
          - lt-api
        type: A
        port: 9100
        refresh_interval: 15s
    metrics_path: /metrics

  # Все реплики llm-worker (compose DNS отдаёт A-записи по имени сервиса).
  # static_configs на llm-worker:9101 при --scale скрейпит только один контейнер.
  - job_name: jobdesk-llm-worker
    dns_sd_configs:
      - names:
          - llm-worker
        type: A
        port: 9101
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: dns_name

  - job_name: jobdesk-parse-worker
    dns_sd_configs:
      - names:
          - parse-worker
        type: A
        port: 9102
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: dns_name

  - job_name: jobdesk-hh-worker
    dns_sd_configs:
      - names:
          - hh-worker
        type: A
        port: 9103
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: dns_name
