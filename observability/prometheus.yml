global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tg-jobs-backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: tg-jobs-llm-worker
    static_configs:
      - targets: ["llm-worker:9101"]
    metrics_path: /metrics
