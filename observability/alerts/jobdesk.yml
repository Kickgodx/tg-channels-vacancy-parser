# Алерты jobdesk (openspec/specs/platform/alerting). Пороги — оттуда же.
# Prometheus читает этот каталог (rule_files в prometheus.yml), сработавшие алерты уходят в
# Alertmanager: наружу он их не отправляет, смотреть — UI :9093 или Grafana → Alerting.
# Тесты правил — observability/alerts/tests/, запуск — scripts/check_alerts.sh.
#
# job="jobdesk-backend" в выражениях: стенд нагрузочного теста (job="jobdesk-loadtest")
# отдаёт те же метрики API, и его перегружают намеренно.

groups:
  - name: jobdesk-jobs
    rules:
      - alert: JobLeaseExpired
        # Recover идёт раз в JOB_RECOVER_INTERVAL_SECONDS (60 с): 5 минут с истёкшим
        # lease — recover не работает (воркер мёртв или не поднимает задачи).
        expr: max by (kind) (db_jobs_lease_expired{job="jobdesk-backend"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Задача {{ $labels.kind }} в running с истёкшим lease"
          description: "Recover не возвращает её в очередь больше 5 минут. Проверьте воркер и логи recover."

      - alert: LlmQueueGrowing
        # Не пустела 15 минут и за них выросла — воркеры не успевают. Один порог глубины
        # шумел бы на легальных всплесках (импорт до 50 текстов).
        expr: |
          min_over_time(llm_rq_queue_jobs{job="jobdesk-backend", queue="llm"}[15m]) > 0
          and
          delta(llm_rq_queue_jobs{job="jobdesk-backend", queue="llm"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Очередь LLM растёт и не разбирается"
          description: "Очередь RQ llm не пустела 15 минут и выросла. Проверьте llm-worker и лимиты провайдера (дашборд LLM jobs / queue)."

      - alert: ParseQueueStuck
        # Прогон активен один: живой parse-worker берёт его сразу.
        expr: llm_rq_queue_jobs{job="jobdesk-backend", queue="parse"} > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Прогон висит в очереди parse"
          description: "Задача в очереди RQ parse дольше 10 минут — parse-worker не берёт её."

      - alert: ParseRunFailed
        # Окно 24 ч: доставки нет, короткий алерт в UI никто бы не увидел.
        expr: max(db_parse_runs_finished_24h{job="jobdesk-backend", status="failed"}) > 0
        labels:
          severity: warning
        annotations:
          summary: "Прогон парсинга завершился ошибкой"
          description: "За последние 24 часа есть прогон со статусом failed. Причина — error_message прогона на вкладке «Парсинг»."

  - name: jobdesk-llm
    rules:
      - alert: LlmDisabled
        # Счётчик растёт раз за разбор; окно 24 ч держит алерт видимым.
        expr: sum by (reason) (increase(llm_enrich_disabled_total[24h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "LLM отключался при разборе: {{ $labels.reason }}"
          description: "За последние 24 часа прогон или LLM-импорт продолжал без LLM (circuit_breaker — ошибки подряд, quota — квота/лимит/бюджет, init_failed — AI не запустился). Причина — в предупреждениях прогона."

  - name: jobdesk-data
    rules:
      - alert: FxRatesStale
        # Обычные выходные укладываются в 3 суток: курс на субботу ЦБ публикует в пятницу.
        # На длинные праздники — silence в Alertmanager.
        expr: time() - fx_latest_rate_timestamp_seconds{job="jobdesk-backend"} > 3 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Курс ЦБ старше 3 суток"
          description: "Последний курс в exchange_rates старше 3 суток — рублёвые суммы зарплат считаются по устаревшему курсу. Проверьте синк курсов (логи backend, fx_cbr_requests_total)."

  - name: jobdesk-api
    rules:
      - alert: ApiOverloaded
        expr: |
          sum(rate(api_overload_rejections_total{job="jobdesk-backend"}[5m])) > 0.1
          and
          sum(rate(api_overload_rejections_total{job="jobdesk-backend"}[5m]))
            / sum(rate(http_requests_total{job="jobdesk-backend"}[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API отклоняет запросы: 503 OVERLOADED"
          description: "Больше 1% запросов получают 503 OVERLOADED. Нужны процессы API (API_WORKERS) или разбор медленных запросов (дашборды API и DB pool)."

  - name: jobdesk-targets
    rules:
      - alert: TargetDown
        # Ловит и остановленный воркер: Docker DNS на имя остановленного контейнера отвечает
        # ошибкой, и DNS SD при ошибке держит прежний адрес — цель остаётся с up == 0.
        expr: up{job=~"jobdesk-backend|jobdesk-llm-worker|jobdesk-parse-worker|jobdesk-hh-worker|jobdesk-maintenance-worker"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} не отвечает на scrape"
          description: "Цель {{ $labels.instance }} не отдаёт /metrics больше 5 минут."

      - alert: WorkerMissing
        # У воркера нет ни одной цели: не запускался с момента старта Prometheus (Prometheus
        # перезапущен при остановленном воркере, --scale 0). Такой случай up == 0 не ловит.
        expr: |
          absent(up{job="jobdesk-llm-worker"})
          or absent(up{job="jobdesk-parse-worker"})
          or absent(up{job="jobdesk-hh-worker"})
          or absent(up{job="jobdesk-maintenance-worker"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Нет ни одного {{ $labels.job }}"
          description: "У воркера нет целей скрейпа больше 5 минут — контейнер не запущен."

  - name: jobdesk-backup
    rules:
      - alert: PgBackupStale
        # Тот же порог, что у healthcheck pg-backup. for: 1h — первый дамп на свежей
        # установке (last_verified = 0), пока он снимается.
        expr: time() - pg_backup_last_verified_timestamp_seconds > 1.5 * pg_backup_interval_seconds
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Нет свежего проверенного бэкапа"
          description: "Последний проверенный дамп старше 1,5 интервала бэкапа. Проверьте контейнер pg-backup и его логи."

      - alert: PgBackupFailed
        expr: pg_backup_last_attempt_success == 0
        labels:
          severity: critical
        annotations:
          summary: "Последняя попытка бэкапа провалилась"
          description: "pg_dump или проверка восстановления не прошли; повтор — через BACKUP_RETRY_MINUTES. Подробности — в логах pg-backup."

      - alert: PgBackupMetricsMissing
        expr: absent(pg_backup_last_verified_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Нет метрик бэкапа"
          description: "pg_backup.prom не доходит до Prometheus: pg-backup не пишет файл или Alloy его не читает."
