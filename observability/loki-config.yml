# Loki single-binary: локальное файловое хранилище, retention 30 дней.
# Монтируется в контейнер как /etc/loki/local-config.yaml.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h # 30 дней
  allow_structured_metadata: true
  volume_enabled: true
  # Локальный стек: HTTP-логи с телами легко бьют дефолт 4MB/s → Alloy 429 и
  # отставание tail'а docker-логов. Под нагрузкой UI/ab нужен запас.
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  per_stream_rate_limit: 16MB
  per_stream_rate_limit_burst: 32MB

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h
