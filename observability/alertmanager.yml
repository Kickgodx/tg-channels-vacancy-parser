# Alertmanager: алерты Prometheus (observability/alerts/) копятся здесь и видны в UI :9093 и в
# Grafana → Alerting. Доставки нет: получатель ui-only без каналов.
#
# Подключить канал — добавить конфигурацию в получателя, например Telegram:
#   receivers:
#     - name: ui-only
#       telegram_configs:
#         - bot_token_file: /etc/alertmanager/telegram_token   # файл смонтировать в сервис
#           chat_id: 123456789
# Alertmanager не подставляет переменные окружения в этот файл — секреты только файлами.

route:
  receiver: ui-only
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: ui-only
