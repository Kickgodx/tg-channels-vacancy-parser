[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-jobs-parser"
version = "0.1.0"
description = "MVP-парсер Telegram-каналов с IT-вакансиями через Telethon (Windows-first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "pydantic[email]>=2.6.0",
  "pydantic-settings>=2.2.0",
  "PyYAML>=6.0",
  "openpyxl>=3.1.0",
  "rapidfuzz>=3.6.0",
  "telethon>=1.34.0",
  "python-dotenv>=1.0.0",
  "openai (>=2.37.0,<3.0.0)",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  # <2.1: opentelemetry-instrumentation-sqlalchemy 0.65b0 не поддерживает 2.1 (молча не включается).
  "sqlalchemy>=2.0.0,<2.1",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "prometheus-fastapi-instrumentator (>=7.0.0)",
  "pwdlib[argon2]>=0.2.0",
  "pyjwt>=2.8.0",
  # OpenTelemetry: SDK и contrib-инструментации выпускаются парами (1.X ↔ 0.Yb0) — держим в паре.
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-instrumentation-sqlalchemy==0.65b0",
  "opentelemetry-instrumentation-httpx==0.65b0",
  "redis (>=5.0.0)",
  "rq (>=2.0.0)",
  # Текст резюме из PDF (загрузка файла); DOCX разбирается stdlib.
  "pypdf (>=5.0.0)",
  # Карта рынка: PCA + t-SNE + k-means по эмбеддингам вакансий (тянет numpy и scipy).
  "scikit-learn (>=1.5.0)",
]

[project.optional-dependencies]
# Poetry: poetry install --extras telethon — опционально cryptg для ускорения Telethon на Windows
# testcontainers: тесты сами поднимают postgres:16 + pgvector (docker/postgres), если не задан TEST_DATABASE_URL.
dev = ["pytest>=8.0.0", "pytest-xdist>=3.5.0", "pytest-cov>=6.0.0", "ruff>=0.14.0,<1.0.0", "fakeredis>=2.26.0", "testcontainers>=4.8.0"]
telethon = ["cryptg>=0.5.0"]
# MCP-сервер (tg_jobs_mcp): клиент HTTP API для Claude Desktop / Claude Code; в образ backend не входит.
mcp = ["mcp>=2.3.0,<3"]

[project.scripts]
tg-jobs-parser = "tg_jobs_parser.cli.app:main"
tg-jobs-api = "backend.main:main"
tg-jobs-llm-worker = "backend.workers.llm_worker:main"
tg-jobs-parse-worker = "backend.workers.parse_worker:main"
tg-jobs-hh-worker = "backend.workers.hh_worker:main"
tg-jobs-mcp = "tg_jobs_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m \"not llm\""
markers = [
  "llm: live OpenRouter calls (needs OPENROUTER_API_KEY; not in default CI)",
]

# Покрытие считается по запросу (`pytest --cov`), в addopts не включено — замедляет прогон.
[tool.coverage.run]
source = ["tg_jobs_parser", "backend", "tg_jobs_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
precision = 1
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["tg_jobs_parser", "backend", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # Ruff-specific
]
ignore = [
  "E501",   # длина строк — ориентир formatter / editorconfig (120)
  "B008",   # FastAPI Depends / Typer Option в defaults
  "RUF001", # кириллица / en-dash в строках — ожидаемо для RU-проекта
  "RUF002", # кириллица в docstring
  "RUF003", # кириллица в комментариях
]

[tool.ruff.lint.isort]
known-first-party = ["tg_jobs_parser", "backend"]

[tool.ruff.lint.per-file-ignores]
# Исторические миграции не трогаем (UP/I ломают стабильность ревизий).
"alembic/versions/*" = ["UP", "I", "RUF"]
# Локальные отладочные скрипты вне пакета.
"z*.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[dependency-groups]
dev = [
    "fakeredis (>=2.26.0)"
]
