[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-jobs-parser"
version = "0.1.0"
description = "MVP-парсер Telegram-каналов с IT-вакансиями через Telethon (Windows-first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "PyYAML>=6.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "rapidfuzz>=3.6.0",
  "matplotlib>=3.8.0",
  "telethon>=1.34.0",
  "python-dotenv>=1.0.0",
  "openai (>=2.37.0,<3.0.0)",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
]

[project.optional-dependencies]
# Poetry: poetry install --extras telethon — опционально cryptg для ускорения Telethon на Windows
dev = ["pytest>=8.0.0"]
telethon = ["cryptg>=0.5.0"]

[project.scripts]
tg-jobs-parser = "tg_jobs_parser.cli.app:main"
tg-jobs-api = "backend.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
