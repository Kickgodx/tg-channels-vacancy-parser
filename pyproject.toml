[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-jobs-parser"
version = "0.1.0"
description = "MVP-парсер публичных Telegram-каналов с IT-вакансиями (Windows-first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "typer>=0.12.0",
  "pydantic>=2.6.0",
  "PyYAML>=6.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "rapidfuzz>=3.6.0",
  "matplotlib>=3.8.0",
  "plotly>=5.18.0",
  "streamlit>=1.32.0",
]

[project.optional-dependencies]
# Poetry: poetry install --extras telethon  (без extras Telethon не ставится)
dev = ["pytest>=8.0.0"]
telethon = ["telethon>=1.34.0", "python-dotenv>=1.0.0", "cryptg>=0.5.0"]

[project.scripts]
tg-jobs-parser = "tg_jobs_parser.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
