# Порты публикуются на loopback: стек доступен с этой машины (localhost), но не из сети.
# BIND_ADDR — UI и API, INFRA_BIND_ADDR — Postgres, Redis и observability (у них нет
# своей аутентификации либо дефолтные пароли). Открыть в сеть: BIND_ADDR=0.0.0.0 в .env.

# Ротация stdout-логов контейнеров (по умолчанию json-file растёт без лимита):
# до 5 файлов по 10 МБ на контейнер, ротированные — gzip. Alloy читает логи
# через Docker API, на сбор в Loki это не влияет.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://tgjobs:tgjobs@postgres:5432/tgjobs
  CONFIG_PATH: /app/config.yaml
  PYTHONUNBUFFERED: "1"
  LOG_DIR: ""
  REDIS_URL: redis://redis:6379/0
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile.backend
  logging: *default-logging
  # Упавший воркер без restart оставляет прогон в queued и блокирует новые запуски.
  restart: unless-stopped
  env_file:
    - .env
  depends_on: &infra-ready
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

# Воркеры ждут healthy backend: миграции (alembic upgrade head) применяет он.
x-worker-depends-on: &worker-depends-on
  <<: *infra-ready
  backend:
    condition: service_healthy

# В образе backend нет curl/wget — проверяем через python. Воркеры отвечают
# на порту метрик: это «процесс жив», а не «джобы выполняются».
x-worker-healthcheck: &worker-healthcheck
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: tgjobs
      POSTGRES_PASSWORD: tgjobs
      POSTGRES_DB: tgjobs
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgjobs -d tgjobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    logging: *default-logging
    # Host 6379 often falls into Windows Hyper-V/WinNAT excluded ranges (≈6251–6450).
    # Containers still use redis:6379; host clients → 127.0.0.1:16379.
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *app-common
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9000:8000"
    environment:
      <<: *app-env
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OTEL_SERVICE_NAME: tg-jobs-parser-backend
      LLM_JOB_BACKEND: rq
      PARSE_JOB_BACKEND: rq
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./llm_models.yaml:/app/llm_models.yaml:ro
      - ./sessions:/app/sessions
      - ./output:/app/output
    # /health отвечает 200 и при недоступной БД (status=degraded) — смотрим на поле.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          body = json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=4))
          sys.exit(0 if body.get("status") == "ok" else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # Параллелизм LLM = число реплик: docker compose up --scale llm-worker=4
  # Метрики :9101 только в Docker-сети (Prometheus dns_sd → все реплики);
  # host port mapping убран — иначе --scale конфликтует по 9101 на хосте.
  # Entrypoint: SimpleWorker (без fork) — метрики и экономия RAM.
  llm-worker:
    <<: *app-common
    command: ["tg-jobs-llm-worker"]
    depends_on: *worker-depends-on
    environment:
      <<: *app-env
      LLM_JOB_BACKEND: rq
      LLM_WORKER_METRICS_PORT: "9101"
      OTEL_SERVICE_NAME: tg-jobs-parser-llm-worker
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./llm_models.yaml:/app/llm_models.yaml:ro
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=4)"]

  # Parse: один active run на БД; concurrency=1 (не scale). sessions/ — Telethon.
  # Метрики :9102 в Docker-сети (Prometheus dns_sd).
  parse-worker:
    <<: *app-common
    command: ["tg-jobs-parse-worker"]
    depends_on: *worker-depends-on
    environment:
      <<: *app-env
      PARSE_JOB_BACKEND: rq
      PARSE_WORKER_METRICS_PORT: "9102"
      OTEL_SERVICE_NAME: tg-jobs-parser-parse-worker
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./llm_models.yaml:/app/llm_models.yaml:ro
      - ./sessions:/app/sessions
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/metrics', timeout=4)"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:9000/api/v1
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    logging: *default-logging
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    logging: *default-logging
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    profiles: ["observability"]
    logging: *default-logging
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.5
    profiles: ["observability"]
    logging: *default-logging
    # root нужен для чтения docker.sock; Docker Desktop на Windows тоже
    # отдаёт unix-сокет внутрь WSL2-VM, поэтому путь кроссплатформенный.
    user: root
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:12345:12345"
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    profiles: ["observability"]
    logging: *default-logging
    # Образ работает под uid 10001, а named volume создаётся root'ом — без
    # этого Tempo не может писать WAL/блоки в /var/tempo.
    user: root
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:3200:3200"
    volumes:
      - ./observability/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

volumes:
  pgdata:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
