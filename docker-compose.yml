# Ротация stdout-логов контейнеров (по умолчанию json-file растёт без лимита):
# до 5 файлов по 10 МБ на контейнер, ротированные — gzip. Alloy читает логи
# через Docker API, на сбор в Loki это не влияет.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: tgjobs
      POSTGRES_PASSWORD: tgjobs
      POSTGRES_DB: tgjobs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgjobs -d tgjobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    logging: *default-logging
    # Host 6379 often falls into Windows Hyper-V/WinNAT excluded ranges (≈6251–6450).
    # Containers still use redis:6379; localhost clients → 16379.
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    logging: *default-logging
    ports:
      - "9000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://tgjobs:tgjobs@postgres:5432/tgjobs
      CONFIG_PATH: /app/config.yaml
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PYTHONUNBUFFERED: "1"
      LOG_DIR: ""
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: tg-jobs-parser-backend
      LLM_JOB_BACKEND: rq
      PARSE_JOB_BACKEND: rq
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./llm_models.yaml:/app/llm_models.yaml:ro
      - ./sessions:/app/sessions
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Параллелизм LLM = число реплик: docker compose up --scale llm-worker=4
  # Метрики :9101 только в Docker-сети (Prometheus dns_sd → все реплики);
  # host port mapping убран — иначе --scale конфликтует по 9101 на хосте.
  # Entrypoint: SimpleWorker (без fork) — метрики и экономия RAM.
  llm-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    logging: *default-logging
    command: ["tg-jobs-llm-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://tgjobs:tgjobs@postgres:5432/tgjobs
      CONFIG_PATH: /app/config.yaml
      PYTHONUNBUFFERED: "1"
      LOG_DIR: ""
      LLM_JOB_BACKEND: rq
      REDIS_URL: redis://redis:6379/0
      LLM_WORKER_METRICS_PORT: "9101"
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: tg-jobs-parser-llm-worker
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./llm_models.yaml:/app/llm_models.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Parse: один active run на БД; concurrency=1 (не scale). sessions/ — Telethon.
  # Метрики :9102 в Docker-сети (Prometheus dns_sd).
  parse-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    logging: *default-logging
    command: ["tg-jobs-parse-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://tgjobs:tgjobs@postgres:5432/tgjobs
      CONFIG_PATH: /app/config.yaml
      PYTHONUNBUFFERED: "1"
      LOG_DIR: ""
      PARSE_JOB_BACKEND: rq
      REDIS_URL: redis://redis:6379/0
      PARSE_WORKER_METRICS_PORT: "9102"
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: tg-jobs-parser-parse-worker
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./llm_models.yaml:/app/llm_models.yaml:ro
      - ./sessions:/app/sessions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    logging: *default-logging
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:9000/api/v1
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.2.1
    logging: *default-logging
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    logging: *default-logging
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.5
    logging: *default-logging
    # root нужен для чтения docker.sock; Docker Desktop на Windows тоже
    # отдаёт unix-сокет внутрь WSL2-VM, поэтому путь кроссплатформенный.
    user: root
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    logging: *default-logging
    # Образ работает под uid 10001, а named volume создаётся root'ом — без
    # этого Tempo не может писать WAL/блоки в /var/tempo.
    user: root
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

volumes:
  pgdata:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
