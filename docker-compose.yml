# Порты публикуются на loopback: стек доступен с этой машины (localhost), но не из сети.
# BIND_ADDR — UI и API, INFRA_BIND_ADDR — Postgres, Redis и observability (у Prometheus,
# Loki, Tempo и Alloy своей аутентификации нет). Открыть в сеть: BIND_ADDR=0.0.0.0 в .env
# (backend в APP_ENV=dev на не-loopback адресе не стартует — нужен APP_ENV=prod).
#
# Пароли Postgres, Redis и Grafana обязательны и задаются в .env (POSTGRES_PASSWORD,
# REDIS_PASSWORD, GRAFANA_ADMIN_PASSWORD; см. .env.example) — дефолтных нет.

# Ротация stdout-логов контейнеров (по умолчанию json-file растёт без лимита):
# до 5 файлов по 10 МБ на контейнер, ротированные — gzip. Alloy читает логи
# через Docker API, на сбор в Loki это не влияет.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://tgjobs:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/tgjobs
  CONFIG_PATH: /app/config.yaml
  PYTHONUNBUFFERED: "1"
  LOG_DIR: ""
  REDIS_URL: redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}@redis:6379/0
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile.backend
  logging: *default-logging
  # Упавший воркер без restart оставляет прогон в queued и блокирует новые запуски.
  restart: unless-stopped
  env_file:
    - .env
  depends_on: &infra-ready
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

# Воркеры ждут healthy backend: миграции (alembic upgrade head) применяет он.
x-worker-depends-on: &worker-depends-on
  <<: *infra-ready
  backend:
    condition: service_healthy

# В образе backend нет curl/wget — проверяем через python. Healthcheck воркера смотрит
# не на ответ порта метрик («процесс жив»), а на возраст heartbeat в /metrics: цикл RQ
# и lease выполняемой джобы (backend/workers/liveness.py), порог — 180 с
# (WORKER_HEARTBEAT_MAX_AGE_SECONDS). unhealthy Docker сам не перезапускает — поэтому
# воркер, чей heartbeat молчит дольше WORKER_STALL_EXIT_SECONDS (900), завершается сам,
# а restart: unless-stopped поднимает его заново.
x-worker-healthcheck: &worker-healthcheck
  interval: 15s
  timeout: 10s
  retries: 4
  start_period: 30s

services:
  postgres:
    # postgres:16-alpine + pgvector (docker/postgres/Dockerfile): эмбеддинги вакансий и резюме.
    build: docker/postgres
    image: tgjobs-postgres:16-pgvector0.8.7
    logging: *default-logging
    # POSTGRES_PASSWORD применяется только при инициализации пустого pgdata; сменить на
    # существующем томе: docker compose exec postgres psql -U tgjobs -c "ALTER ROLE tgjobs PASSWORD '...'"
    environment:
      POSTGRES_USER: tgjobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: tgjobs
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgjobs -d tgjobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    logging: *default-logging
    # Host 6379 often falls into Windows Hyper-V/WinNAT excluded ranges (≈6251–6450).
    # Containers still use redis:6379; host clients → 127.0.0.1:16379.
    # Пароль — из REDISCLI_AUTH: его же берёт redis-cli в healthcheck (без -a в argv).
    # AOF (fsync раз в секунду) на томе redis_data: рестарт контейнера не теряет очереди
    # RQ — без него потерянные джобы поднимал только recover-цикл, с задержкой.
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDISCLI_AUTH" --appendonly yes --appendfsync everysec']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Плановый pg_dump всей базы + проверка восстановления во временный кластер внутри
  # контейнера (scripts/pg_backup.sh). Дампы — на хосте в BACKUP_HOST_DIR (переживают
  # down -v). Образ — тот же, что у postgres: pg_dump не может быть старше сервера, а проверка
  # восстановления создаёт расширение vector во временном кластере.
  # Внеплановый дамп: docker compose exec pg-backup /scripts/pg_backup.sh once
  # unhealthy — последний проверенный дамп старше 1,5 × BACKUP_INTERVAL_HOURS.
  pg-backup:
    build: docker/postgres
    image: tgjobs-postgres:16-pgvector0.8.7
    logging: *default-logging
    entrypoint: ["/bin/sh", "/scripts/pg_backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: tgjobs
      PGDATABASE: tgjobs
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./scripts/pg_backup.sh:/scripts/pg_backup.sh:ro
      - ${BACKUP_HOST_DIR:-./backup/pg}:/backups
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - test $$(( $$(date +%s) - $$(cat /backups/.last_verified 2>/dev/null || echo 0) )) -lt $$(( BACKUP_INTERVAL_HOURS * 5400 ))
      interval: 5m
      timeout: 5s
      start_period: 1h

  backend:
    <<: *app-common
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9000:8000"
    environment:
      <<: *app-env
      # Внутри контейнера слушаем все интерфейсы; наружу порт опубликован на BIND_ADDR —
      # по нему backend решает, доступен ли он из сети (dev на не-loopback не стартует).
      API_HOST: 0.0.0.0
      API_PUBLIC_ADDR: ${BIND_ADDR:-127.0.0.1}
      # Процессов API в контейнере: GIL держит один процесс на ~1 ядре. Пул БД (20 + 20)
      # делится между ними, очистку и /metrics ведёт один (лидер). Нужны REDIS_URL,
      # JWT_SECRET и rq у всех задач — ниже они заданы. Подбор под хост — scripts/loadtest.
      API_WORKERS: ${API_WORKERS:-4}
      # /metrics — отдельный порт только в Docker-сети (Prometheus), на хост не публикуется.
      API_METRICS_PORT: "9100"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OTEL_SERVICE_NAME: tg-jobs-parser-backend
      LLM_JOB_BACKEND: rq
      PARSE_JOB_BACKEND: rq
      HH_SYNC_JOB_BACKEND: rq
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./llm_models.yaml:/app/llm_models.yaml:ro
      - ./sessions:/app/sessions
    # /health отвечает 200 и при недоступной БД (status=degraded) — смотрим на поле.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          body = json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=4))
          sys.exit(0 if body.get("status") == "ok" else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # Параллелизм LLM = число реплик: docker compose up --scale llm-worker=4
  # Пул БД у воркера 2+2 (DB_POOL_SIZE / DB_MAX_OVERFLOW) — реплики не выбирают max_connections.
  # Метрики :9101 только в Docker-сети (Prometheus dns_sd → все реплики);
  # host port mapping убран — иначе --scale конфликтует по 9101 на хосте.
  # Entrypoint: SimpleWorker (без fork) — метрики и экономия RAM.
  llm-worker:
    <<: *app-common
    command: ["tg-jobs-llm-worker"]
    depends_on: *worker-depends-on
    environment:
      <<: *app-env
      LLM_JOB_BACKEND: rq
      LLM_WORKER_METRICS_PORT: "9101"
      OTEL_SERVICE_NAME: tg-jobs-parser-llm-worker
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./llm_models.yaml:/app/llm_models.yaml:ro
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "backend.workers.healthcheck", "--port", "9101"]

  # Parse: один active run на БД; concurrency=1 (не scale). sessions/ — Telethon.
  # Метрики :9102 в Docker-сети (Prometheus dns_sd).
  parse-worker:
    <<: *app-common
    command: ["tg-jobs-parse-worker"]
    depends_on: *worker-depends-on
    environment:
      <<: *app-env
      PARSE_JOB_BACKEND: rq
      PARSE_WORKER_METRICS_PORT: "9102"
      OTEL_SERVICE_NAME: tg-jobs-parser-parse-worker
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./llm_models.yaml:/app/llm_models.yaml:ro
      - ./sessions:/app/sessions
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "backend.workers.healthcheck", "--port", "9102"]

  # HH sync (POST /hh/sync → 202): до ~2000 detail-запросов при 3 rps, 10+ минут.
  # Своя очередь hh — sync не ждёт многочасовой прогон в очереди parse.
  # Метрики :9103 в Docker-сети (Prometheus dns_sd).
  hh-worker:
    <<: *app-common
    command: ["tg-jobs-hh-worker"]
    depends_on: *worker-depends-on
    environment:
      <<: *app-env
      HH_SYNC_JOB_BACKEND: rq
      HH_WORKER_METRICS_PORT: "9103"
      OTEL_SERVICE_NAME: tg-jobs-parser-hh-worker
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./llm_models.yaml:/app/llm_models.yaml:ro
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "backend.workers.healthcheck", "--port", "9103"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5173:5173"
    environment:
      # Браузер ходит в /api того же origin, Vite проксирует на backend по сети compose:
      # refresh-cookie первосторонний при любом хосте UI (localhost, 127.0.0.1, IP).
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    logging: *default-logging
    # remote-write-receiver: метрики k6 нагрузочного теста (scripts/loadtest/run.sh PROM_RW=1).
    # Запись без аутентификации — порт опубликован только на INFRA_BIND_ADDR (loopback).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
    depends_on:
      - backend
      - alertmanager
    restart: unless-stopped

  # Алерты Prometheus без доставки наружу: UI на :9093 и Grafana → Alerting
  # (observability/alertmanager.yml — как подключить канал).
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["observability"]
    logging: *default-logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    logging: *default-logging
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:3000:3000"
    # Пароль admin применяется только при инициализации пустого grafana_data; сменить на
    # существующем томе: docker compose exec grafana grafana cli admin reset-admin-password '...'
    # Не ${...:?}: compose проверяет такие переменные и при выключенном профиле observability,
    # а без него пароль Grafana не нужен. Пустой или admin — отказ стартовать.
    entrypoint:
      - sh
      - -c
      - |
        case "$$GF_SECURITY_ADMIN_PASSWORD" in
          ""|admin) echo "задайте GRAFANA_ADMIN_PASSWORD в .env (не пустой и не admin)" >&2; exit 1 ;;
        esac
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    profiles: ["observability"]
    logging: *default-logging
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  # Docker API для Alloy — только чтение списка контейнеров, сетей и их логов.
  # Полный docker.sock в Alloy (OTLP-приёмник, UI) = root на хосте; здесь сокет есть
  # только у прокси, POST/exec/start запрещены. Docker Desktop на Windows тоже отдаёт
  # unix-сокет внутрь WSL2-VM, поэтому путь кроссплатформенный.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    profiles: ["observability"]
    logging: *default-logging
    environment:
      CONTAINERS: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.5
    profiles: ["observability"]
    logging: *default-logging
    # Непривилегированный пользователь образа. Том alloy_data, созданный прежним
    # root-Alloy, нужно один раз отдать ему:
    # docker run --rm -v tg_jobs_parser_alloy_data:/d alpine chown -R 473:473 /d
    user: "473:473"
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:12345:12345"
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # pg_backup.prom (метрики бэкапа для алертов) — только чтение.
      - ${BACKUP_HOST_DIR:-./backup/pg}:/backups:ro
    networks:
      - default
      - docker-api
    depends_on:
      - docker-socket-proxy
      - loki
      - tempo
      - prometheus
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    profiles: ["observability"]
    logging: *default-logging
    # Образ работает под uid 10001, а named volume создаётся root'ом — без
    # этого Tempo не может писать WAL/блоки в /var/tempo.
    user: root
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:13200:3200"
    volumes:
      - ./observability/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

networks:
  # Только alloy ↔ docker-socket-proxy: остальные контейнеры до Docker API не дотягиваются.
  docker-api:
    internal: true

volumes:
  pgdata:
  redis_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  alloy_data:
  tempo_data:
