# Опциональный AI (OpenRouter). Включите enabled: true и задайте OPENROUTER_API_KEY в .env
ai:
  enabled: true
  mode: primary
  provider: openrouter
  # id из llm_models.yaml; fallback — default_fallbacks из того же файла (в UI можно сменить)
  model: anthropic/claude-haiku-5.5
  # Матчинг резюме ↔ вакансия идёт отдельной моделью: здесь уместна reasoning
  # (качество важнее скорости — вызовов на порядок меньше, чем при парсинге).
  # Пусто — берётся model выше. При смене на reasoning-модель включи match_reasoning_enabled.
  # match_model: google/gemini-3.8-flash
  # match_model: z-ai/glm-5.3
  match_model: xiaomi/mimo-v2.6-pro
  match_reasoning_enabled: true
  # Уровень рассуждений (OpenRouter reasoning.effort): max / xhigh / high / medium / low /
  # minimal / none; пусто — дефолт модели. Неподдерживаемый уровень сводится к ближайшему.
  match_reasoning_effort: high
  # Сопроводительные письма идут отдельной моделью; пусто — match_model, затем model.
  # cover_letter_model:
  max_posts_per_run: 0
  skip_if_vacancy_score_below: 1
  concurrency: 8
  # Фоновые джобы мэтчинга / писем (in-process ThreadPool); не путать с concurrency парсинга.
  interactive_concurrency: 4
  interactive_per_user_limit: 2
  requests_per_minute: 480
  # Суточный (UTC) бюджет запросов мэтчинга и писем всех пользователей; парсинг не ограничен. 0 — без бюджета.
  interactive_daily_request_budget: 0
  max_retries_on_429: 0
  retry_base_delay_seconds: 5
  # Повторы при 5xx / таймауте / обрыве соединения (backoff 2/4/8… с); 0 — без повторов.
  max_retries_on_error: 2
  stop_llm_when_rate_limited: true
  use_cache: true
  cache_backend: postgres
  cache_ttl_days: 90
  reasoning_enabled: false
  max_completion_tokens: 8192
  allow_unknown_specializations: true
  use_few_shot: true

search:
  # week_ago / week / today-7d / неделя — нижняя граница = сегодня минус 7 дней при каждом запуске; иначе ISO-дата
  date_from: week_ago
  # today / сегодня / пусто — верхняя граница = сегодня при каждом запуске; иначе ISO-дата
  date_to: today
  max_days: 365

filters:
  specializations:
    - Python
    - Java
    - QA
    - AQA
    - SDET
    - Go
    - Golang
    - Software Engineer
    - Backend
    - AI
  exclude_keywords:
    - junior
    - intern
    - курсы
    - реклама
    - оператор
    - поддержка
    - поддержки
    - helpdesk
    - call center
  countries: []
  cities: []
  work_formats:
    - any

fx:
  enabled: true
  provider: cbr
  default_currency_if_missing: RUB
  display_currency: RUB
  sync_days_on_startup: 14
  request_timeout_seconds: 20

retention:
  # Через сколько дней архивировать вакансию (post_date, а без неё — parsed_at). 0 — не архивировать.
  vacancy_ttl_days: 40
  # Очистка служебных таблиц (раз в час): завершённые прогоны и LLM-джобы старше N дней. 0 — хранить.
  parse_runs_ttl_days: 180
  llm_jobs_ttl_days: 30

hh:
  enabled: true
  # TTL кэша короткой выдачи (hh_listings). После purge detail снова запросится.
  listing_ttl_days: 40
  max_rps: 3.0
  # Промежуточная запись в БД + commit; буфер в памяти очищается после каждого батча.
  db_flush_batch_size: 30
  api_base: https://api.hh.ru
  host: hh.ru
  app_name: PersonalJobSearch
  app_version: "1.0"
  search:
    # Как в MVP hhparser: AQA/Python + роли тестировщик (124) и разработчик (96).
    text: >-
      Python AND (автотест* OR AQA OR "QA Automation" OR pytest OR QAA OR QA Auto
      OR "Fullstack QA" OR Automation QA OR SDET OR автоматизатор)
    professional_role: ["124", "96"]
    per_page: 100

parser:
  progress_batch_posts: 25
  # Промежуточная запись уникальных вакансий в БД (для backend-прогонов): каждые N обработанных
  # постов ИЛИ при накоплении db_flush_pending_vacancies штук — что наступит раньше.
  # Если прогон упадёт, уже записанные батчи не потеряются.
  db_flush_every_posts: 500
  db_flush_pending_vacancies: 100
  vacancy_score_threshold: 1
  # Минимум «содержательных» баллов (всё кроме признаков email/@). 1 — не брать только @упоминания.
  vacancy_min_substantive_score: 1
  # Лимит сообщений с канала: для Telethon при заданных date_from/date_to — сколько сообщений подряд
  # можно просмотреть (от новых к старым), пока не выйдем за date_from или не упрёмся в лимит.
  max_posts_per_channel: 20000
  # Сколько каналов опрашивать одновременно через одну Telethon-сессию.
  # 1 = старое последовательное поведение; 3..8 — оптимально; выше повышает риск FloodWait.
  channel_concurrency: 4
  request_timeout_seconds: 25
  sleep_between_requests_seconds: 1
  vacancy_fuzzy_duplicate_threshold: 88
  fuzzy_compare_prefix_len: 500

dictionaries:
  specializations: {}
  exclude_keywords: null
  technologies: []
  work_format_synonyms: {}

output:
  directory: output
  save_progress_batches: false
  partial_batches_subdirectory: partial
