# Опциональный AI (OpenRouter). Включите enabled: true и задайте OPENROUTER_API_KEY в .env
ai:
  enabled: false
  mode: primary
  provider: openrouter
  # id из llm_models.yaml; fallback — default_fallbacks из того же файла (в UI можно сменить)
  model: google/gemini-2.5-flash-lite
  max_posts_per_run: 0
  skip_if_vacancy_score_below: 1
  concurrency: 8
  requests_per_minute: 480
  max_retries_on_429: 0
  retry_base_delay_seconds: 5
  stop_llm_when_rate_limited: true
  use_cache: true
  cache_backend: postgres
  cache_ttl_days: 90
  reasoning_enabled: false
  max_completion_tokens: 8192
  allow_unknown_specializations: true
  use_few_shot: true

search:
  date_from: "2026-05-01"
  # today / сегодня / пусто — верхняя граница = сегодня при каждом запуске; иначе ISO-дата
  date_to: today
  max_days: 365

filters:
  specializations:
    - Python
    - Java
    - QA
    - AQA
    - SDET
    - Go
    - Golang
    - Software Engineer
    - Backend
    - AI
  exclude_keywords:
    - junior
    - intern
    - курсы
    - реклама
    - оператор
    - поддержка
    - поддержки
    - helpdesk
    - call center
  countries: []
  cities: []
  work_formats:
    - any

fx:
  enabled: true
  provider: cbr
  default_currency_if_missing: RUB
  display_currency: RUB
  sync_days_on_startup: 14
  request_timeout_seconds: 20

parser:
  progress_batch_posts: 25
  vacancy_score_threshold: 1
  # Минимум «содержательных» баллов (всё кроме признаков email/@). 1 — не брать только @упоминания.
  vacancy_min_substantive_score: 1
  # Лимит сообщений с канала: для Telethon при заданных date_from/date_to — сколько сообщений подряд
  # можно просмотреть (от новых к старым), пока не выйдем за date_from или не упрёмся в лимит.
  max_posts_per_channel: 20000
  # Сколько каналов опрашивать одновременно через одну Telethon-сессию.
  # 1 = старое последовательное поведение; 3..8 — оптимально; выше повышает риск FloodWait.
  channel_concurrency: 4
  request_timeout_seconds: 25
  sleep_between_requests_seconds: 1
  vacancy_fuzzy_duplicate_threshold: 88
  fuzzy_compare_prefix_len: 500

dictionaries:
  specializations: {}
  exclude_keywords: null
  technologies: []
  work_format_synonyms: {}

output:
  directory: output
  excel_filename: vacancies.xlsx
  json_filename: vacancies.json
  charts_directory: charts
  save_progress_batches: true
  partial_batches_subdirectory: partial
